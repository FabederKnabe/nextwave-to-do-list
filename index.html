<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>nextWAVE Digital — To Do Liste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="supabase.min.js?v=2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p0:oklch(0.7 0.16 25);--p1:oklch(0.78 0.13 80);--p2:oklch(0.72 0.1 200);--p3:oklch(0.7 0.08 280);--r:10px;--rl:14px;}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0e14;--bg2:#15151d;--bg3:rgba(255,255,255,0.04);--bg-hover:rgba(255,255,255,0.05);
  --text:#ecedf0;--text2:#8b8c95;--text3:#5a5b62;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --accent:oklch(0.72 0.14 270);--accent-soft:oklch(0.72 0.14 270 / 0.15);--accent-bg:oklch(0.72 0.14 270 / 0.08);
  --glow:oklch(0.72 0.14 270 / 0.3);
  --shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 30px rgba(0,0,0,0.3);
  --shadow-sm:0 4px 20px rgba(0,0,0,0.2);
  --logo:url('nextwave-logo-white.png');
  --p0:oklch(0.7 0.16 25);--p1:oklch(0.78 0.13 80);--p2:oklch(0.72 0.1 200);--p3:oklch(0.7 0.08 280);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f5f8;--bg2:#ffffff;--bg3:#fbfbfd;--bg-hover:#fbfbfd;
  --text:#1a1a22;--text2:#7a7b85;--text3:#b0b1b9;
  --border:rgba(0,0,0,0.06);--border2:rgba(0,0,0,0.12);
  --accent:oklch(0.5 0.16 270);--accent-soft:oklch(0.5 0.16 270 / 0.1);--accent-bg:oklch(0.5 0.16 270 / 0.05);
  --glow:oklch(0.5 0.16 270 / 0.2);
  --shadow:0 1px 0 rgba(255,255,255,0.8) inset, 0 8px 30px rgba(0,0,0,0.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
  --logo:url('nextwave-logo-dark.png');
  --p0:oklch(0.55 0.18 25);--p1:oklch(0.65 0.15 70);--p2:oklch(0.55 0.1 200);--p3:oklch(0.55 0.08 280);
}
html,body{height:100%}
body{
  font-family:'Geist','Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%,var(--glow),transparent 70%);
  background-attachment:fixed;
  transition:background 0.4s,color 0.4s;
}

/* ============== HEADER ============== */
.header{
  padding:24px 40px;display:flex;align-items:center;justify-content:space-between;
  backdrop-filter:blur(20px);
  background:color-mix(in srgb,var(--bg) 60%,transparent);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{
  height:128px;width:auto;display:block;
  background:var(--logo) no-repeat center/contain;
  aspect-ratio:1/1;
}
.brand-divider{width:1px;height:64px;background:var(--border);margin-left:6px}
.brand-text{
  font-size:22px;color:var(--text);font-weight:300;
  letter-spacing:0.32em;text-transform:uppercase;padding-left:0.32em;
}
.header-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
  background:var(--bg3);border:1px solid var(--border);
  width:36px;height:36px;border-radius:10px;cursor:pointer;
  color:var(--text);display:grid;place-items:center;
  transition:all 0.2s;
}
.icon-btn:hover{background:var(--bg-hover);border-color:var(--border2)}
.icon-btn svg{width:14px;height:14px}

/* ============== LAYOUT ============== */
.layout{display:grid;grid-template-columns:200px 1fr;gap:0;min-height:calc(100vh - 178px)}
.sidebar{
  padding:28px 16px 28px 40px;
  border-right:1px solid var(--border);
}
.nav-section{
  font-size:10px;font-family:'Geist Mono',monospace;
  letter-spacing:0.18em;text-transform:uppercase;
  color:var(--text3);padding:0 12px 10px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;font-size:13px;border-radius:8px;
  color:var(--text2);cursor:pointer;
  transition:all 0.18s;margin-bottom:2px;
  background:transparent;border:none;width:100%;font-family:inherit;text-align:left;
}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item.active{
  background:var(--accent-soft);color:var(--accent);font-weight:500;
}
.nav-icon{width:15px;height:15px;flex-shrink:0;opacity:0.7}
.nav-item.active .nav-icon{opacity:1}
.nb{
  margin-left:auto;font-size:10px;font-family:'Geist Mono',monospace;
  padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;
}
.nav-item:not(.active) .nb{background:var(--bg3);color:var(--text2)}

.main{padding:32px 40px 80px}

/* ============== HERO STATS ============== */
.hero{
  background:var(--bg2);border-radius:20px;padding:28px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;align-items:center;
  margin-bottom:24px;
}
.hero-title{font-size:12px;color:var(--text2);margin-bottom:8px}
.hero-pct{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
.hero-pct-num{
  font-size:44px;font-weight:500;letter-spacing:-0.03em;
  background:linear-gradient(135deg,var(--text),var(--accent));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  font-feature-settings:'tnum';line-height:1;
}
.hero-pct-lbl{font-size:14px;color:var(--text2)}
.progress{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--p1));
  border-radius:999px;transition:width 0.6s cubic-bezier(0.2,0.8,0.2,1);
}
.stat-chip{cursor:pointer;transition:opacity 0.2s}
.stat-chip-lbl{font-size:12px;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.stat-chip-num{
  font-size:36px;font-weight:500;letter-spacing:-0.03em;
  font-feature-settings:'tnum';line-height:1;
  transition:color 0.2s;
}
.stat-chip[data-active="true"] .stat-chip-num{color:var(--accent)}
.stat-chip[data-key="open"] .stat-chip-num{color:var(--accent)}
.stat-chip[data-key="done"] .stat-chip-num{color:var(--p2)}
.stat-chip[data-key="all"] .stat-chip-num{color:var(--text)}
.stat-chip:not([data-active="true"]) .stat-chip-num{opacity:0.55}

/* ============== TOOLBAR ============== */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.filter-group{
  display:flex;padding:4px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--border);
}
.filter-btn{
  padding:8px 16px;font-size:13px;font-weight:500;
  background:transparent;color:var(--text2);
  border:none;border-radius:8px;cursor:pointer;
  transition:all 0.25s cubic-bezier(0.2,0.8,0.2,1);
  font-family:inherit;display:flex;align-items:center;gap:8px;
}
.filter-btn[data-active="true"]{background:var(--accent-soft);color:var(--accent)}
.filter-btn-count{font-size:11px;font-family:'Geist Mono',monospace;opacity:0.7}
.search-wrap{position:relative;flex:1;max-width:360px}
.search-wrap svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--text2);
}
.search-input{
  width:100%;padding:10px 14px 10px 38px;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:13px;
  font-family:inherit;outline:none;transition:all 0.2s;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ============== PRIORITY GROUPS ============== */
.priority-group{margin-top:8px}
.priority-group + .priority-group{margin-top:28px}
.pg-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-left:4px}
.pg-dot{width:8px;height:8px;border-radius:999px}
.pg-dot[data-p="0"]{background:var(--p0);box-shadow:0 0 0 3px color-mix(in srgb,var(--p0) 25%,transparent)}
.pg-dot[data-p="1"]{background:var(--p1);box-shadow:0 0 0 3px color-mix(in srgb,var(--p1) 25%,transparent)}
.pg-dot[data-p="2"]{background:var(--p2);box-shadow:0 0 0 3px color-mix(in srgb,var(--p2) 25%,transparent)}
.pg-dot[data-p="3"]{background:var(--p3);box-shadow:0 0 0 3px color-mix(in srgb,var(--p3) 25%,transparent)}
.pg-title{font-size:14px;font-weight:600;letter-spacing:-0.01em}
.pg-count{
  font-family:'Geist Mono',monospace;font-size:11px;color:var(--text2);
  padding:2px 8px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);
}
.pg-list{
  background:var(--bg2);border-radius:14px;
  border:1px solid var(--border);overflow:hidden;
  box-shadow:var(--shadow-sm);
}

/* ============== TODO ROW ============== */
.todo-row{
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background 0.2s,opacity 0.4s;
}
.todo-row:last-child{border-bottom:none}
.todo-row:hover{background:var(--bg-hover)}
.todo-row.done{opacity:0.5}
.todo-row.done .todo-title{text-decoration:line-through;text-decoration-color:var(--text2);color:var(--text2)}
.todo-compact{display:flex;align-items:flex-start;gap:14px;padding:16px 18px}
.chk{
  width:20px;height:20px;border-radius:6px;
  border:1.5px solid var(--border2);background:transparent;
  display:grid;place-items:center;flex-shrink:0;margin-top:1px;
  cursor:pointer;
  transition:all 0.25s cubic-bezier(0.2,0.8,0.2,1);
}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.tick{transform:scale(1.2);box-shadow:0 0 0 8px var(--accent-soft)}
.chk svg{
  width:12px;height:12px;opacity:0;transform:scale(0.5);
  transition:all 0.25s cubic-bezier(0.2,0.8,0.2,1);
  stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none;
}
.chk.on svg{opacity:1;transform:scale(1)}
.todo-body{flex:1;min-width:0}
.todo-title{font-size:14px;line-height:1.5;color:var(--text);transition:color 0.4s;text-wrap:pretty}
.todo-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:1px}
.prio-pill{
  font-size:10px;font-family:'Geist Mono',monospace;font-weight:600;
  padding:3px 8px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--border);color:var(--text2);
  letter-spacing:0.04em;
}
.expand-arrow{
  font-size:10px;color:var(--text2);transition:transform 0.25s;
  width:18px;height:18px;display:grid;place-items:center;
}
.todo-row.expanded .expand-arrow{transform:rotate(180deg)}

.todo-expanded{
  display:none;padding:0 18px 16px 52px;
  border-top:1px dashed var(--border);
}
.todo-row.expanded .todo-expanded{display:block;padding-top:14px}
.todo-kontext{font-size:13px;color:var(--text2);line-height:1.6;text-wrap:pretty}
.todo-expanded-actions{display:flex;gap:8px;margin-top:12px;align-items:center}
.prio-select{
  font-size:12px;border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;background:var(--bg3);color:var(--text);
  cursor:pointer;font-family:inherit;outline:none;
}
.prio-select:focus{border-color:var(--accent)}
.prio-select option,.add-row select option{background:var(--bg2);color:var(--text)}
.del-btn{
  font-size:12px;color:var(--text2);background:transparent;
  border:1px solid var(--border);border-radius:8px;padding:6px 12px;
  cursor:pointer;font-family:inherit;transition:all 0.18s;
}
.del-btn:hover{color:var(--p0);border-color:var(--p0)}

/* ============== THEMEN ============== */
.thema-list{display:flex;flex-direction:column;gap:8px}
.thema-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;cursor:pointer;
  transition:all 0.18s;box-shadow:var(--shadow-sm);
}
.thema-card:hover{border-color:var(--border2)}
.thema-card.expanded{border-color:var(--accent)}
.thema-compact{padding:14px 18px;display:flex;align-items:center;gap:12px}
.thema-title{font-size:14px;font-weight:500;flex:1}
.thema-date{
  font-size:11px;font-family:'Geist Mono',monospace;
  color:var(--text2);flex-shrink:0;
}
.thema-expanded{display:none;padding:0 18px 16px;border-top:1px dashed var(--border)}
.thema-card.expanded .thema-expanded{display:block;padding-top:14px}
.thema-detail{font-size:13px;color:var(--text2);line-height:1.6;text-wrap:pretty}

/* ============== ADD FORM ============== */
.add-form{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:24px;box-shadow:var(--shadow-sm);
}
.add-form-title{font-size:15px;font-weight:600;margin-bottom:14px;letter-spacing:-0.01em}
.add-row{display:flex;gap:8px;margin-bottom:10px}
.add-row:last-child{margin-bottom:0}
.add-row input,.add-row select,.add-row textarea{
  flex:1;font-size:13px;padding:10px 12px;
  border:1px solid var(--border);border-radius:10px;
  background:var(--bg3);color:var(--text);font-family:inherit;outline:none;
  transition:border 0.2s;
}
.add-row input:focus,.add-row select:focus,.add-row textarea:focus{border-color:var(--accent)}
.add-row textarea{resize:vertical;min-height:80px;line-height:1.5}
.add-row input::placeholder,.add-row textarea::placeholder{color:var(--text3)}

/* ============== BUTTONS ============== */
.btn{
  padding:8px 16px;font-size:13px;border:1px solid var(--border);
  border-radius:10px;cursor:pointer;background:var(--bg3);
  color:var(--text);font-family:inherit;font-weight:500;
  transition:all 0.18s;white-space:nowrap;
}
.btn:hover{background:var(--bg-hover);border-color:var(--border2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 90%,#000);border-color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:12px}

/* ============== THEME DROPDOWN ============== */
.theme-dropdown{position:relative}
.theme-dropdown-menu{
  display:none;position:absolute;right:0;top:calc(100% + 6px);
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:12px;padding:4px;min-width:160px;z-index:300;
  box-shadow:0 12px 40px rgba(0,0,0,0.3);
}
.theme-dropdown-menu.open{display:block;animation:fadeSlide 0.15s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.theme-option{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  font-size:13px;color:var(--text2);cursor:pointer;border-radius:8px;
  transition:all 0.12s;font-family:inherit;
  background:none;border:none;width:100%;text-align:left;
}
.theme-option:hover{background:var(--bg3);color:var(--text)}
.theme-option.active{color:var(--accent);font-weight:500}
.theme-option svg{width:15px;height:15px;flex-shrink:0}

/* ============== MODAL ============== */
.modal-wrap{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:200;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.modal-wrap.open{display:flex;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg2);border-radius:16px;padding:28px;width:480px;max-width:95vw;
  border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,0.4);
  animation:popIn 0.25s cubic-bezier(0.2,0.8,0.2,1);
}
@keyframes popIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.modal h3{font-size:17px;font-weight:600;margin-bottom:6px;letter-spacing:-0.01em}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:16px}
.modal label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;margin-top:14px;font-weight:500}
.modal input{
  width:100%;padding:10px 12px;font-size:13px;
  border:1px solid var(--border);border-radius:10px;
  background:var(--bg3);color:var(--text);font-family:inherit;outline:none;
}
.modal input:focus{border-color:var(--accent)}
.modal-hint{font-size:12px;color:var(--text3);margin-top:10px;line-height:1.5}
.modal-actions{display:flex;gap:8px;margin-top:24px;justify-content:flex-end}

/* ============== STATUS BAR ============== */
.statusbar{
  position:fixed;bottom:0;left:0;right:0;
  background:color-mix(in srgb,var(--bg2) 90%,transparent);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:8px 40px;font-size:11px;font-family:'Geist Mono',monospace;
  color:var(--text2);display:flex;align-items:center;justify-content:space-between;
  z-index:50;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--p2);display:inline-block;margin-right:6px;vertical-align:middle}
.dot.err{background:var(--p0)}.dot.warn{background:var(--p1)}

/* ============== EMPTY STATE ============== */
.empty-state{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:60px 24px;text-align:center;
}
.empty-state-icon{
  width:48px;height:48px;border-radius:14px;margin:0 auto 16px;
  background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);
}
.empty-state-title{font-size:15px;color:var(--text);font-weight:500;margin-bottom:4px}
.empty-state-sub{font-size:13px;color:var(--text2)}

/* ============== SCROLLBAR ============== */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.25);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============== HIDDEN VIEWS ============== */
#viewTodos,#viewThemen,#viewManual{display:none}

/* ============== LOGIN ============== */
.login-wrap{
  display:none;position:fixed;inset:0;z-index:400;
  align-items:center;justify-content:center;
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%,var(--glow),transparent 70%);
}
.login-wrap.open{display:flex}
.login-box{
  width:380px;max-width:92vw;background:var(--bg2);
  border:1px solid var(--border);border-radius:16px;
  padding:32px 28px;box-shadow:var(--shadow);
}
.login-logo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.login-logo-img{height:56px;width:auto}
.login-divider{width:1px;height:36px;background:var(--border)}
.login-subtitle{
  font-size:13px;color:var(--text);font-weight:300;
  letter-spacing:0.28em;text-transform:uppercase;
}
.login-field{margin-bottom:14px}
.login-field label{
  display:block;font-size:11px;color:var(--text2);
  margin-bottom:6px;letter-spacing:0.04em;font-weight:500;
}
.login-field input{
  width:100%;padding:10px 12px;font-size:13px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;color:var(--text);
  font-family:inherit;outline:none;transition:border 0.2s;
}
.login-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.login-btn{
  width:100%;padding:11px 14px;font-size:14px;font-weight:500;
  background:var(--accent);color:#fff;border:none;
  border-radius:10px;cursor:pointer;font-family:inherit;
  margin-top:6px;transition:background 0.18s;
}
.login-btn:hover{background:color-mix(in srgb,var(--accent) 90%,#000)}
.login-btn:disabled{opacity:0.6;cursor:not-allowed}
.login-error{
  margin-top:12px;font-size:12px;color:var(--p0);
  min-height:16px;text-align:center;
}
.login-info{
  margin-top:12px;font-size:12px;color:var(--p2);
  min-height:16px;text-align:center;
}
.login-link{
  display:block;text-align:center;margin-top:14px;
  font-size:12px;color:var(--text2);

<script>
/* ============================================================
   SUPABASE CLIENT
   ============================================================ */
// URL-Hash auslesen, BEVOR supabase-js ihn beim createClient konsumiert
// (detectSessionInUrl=true bereinigt #access_token=…&type=… sofort).
const initialHashType = (() => {
  const h = window.location.hash || '';
  const m = h.match(/[#&]type=(invite|recovery|signup)/);
  return m ? m[1] : null;
})();
const initialHashError = (() => {
  const h = window.location.hash || '';
  const code = h.match(/[#&]error_code=([^&]+)/);
  const desc = h.match(/[#&]error_description=([^&]+)/);
  if (!code && !desc) return null;
  return {
    code: code ? decodeURIComponent(code[1]) : '',
    desc: desc ? decodeURIComponent(desc[1].replace(/\+/g, ' ')) : '',
  };
})();
let needsPasswordSetup = (initialHashType === 'invite' || initialHashType === 'recovery');

const SUPABASE_URL = 'https://eufqqvatktwzyrjzrhoi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1ZnFxdmF0a3R3enlyanpyaG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDY2OTUsImV4cCI6MjA5Mjk4MjY5NX0.JaFG4n3Y223H7EsCxiD3skHdaNmnKU8yNHHQ6D3ZErU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   STATE — gehalten in LS-Objekt (Module-Variable, nicht localStorage).
   Wird nach Login aus todo_data Row 1 befüllt.
   Persistierung via saveField(spalte) — schreibt nur die geänderte
   Spalte zurück (atomar, kein Cross-User-Überschreiben anderer Felder).
   ============================================================ */
const LS = {
  done: {},
  prio: {},
  manual: [],
  deleted: {},
};

let masterData = { todos: [], themen: [] };
let statusFilter = 'open';
let currentView = 'todos';
let currentUser = null;

const COL_BY_KEY = { done: 'done_state', prio: 'prio_state', manual: 'manual_entries', deleted: 'deleted_state' };

async function saveField(stateKey) {
  const col = COL_BY_KEY[stateKey];
  if (!col) return;
  setStatus('Speichern...', 'warn');
  const { error } = await sb.from('todo_data').update({ [col]: LS[stateKey] }).eq('id', 1);
  if (error) {
    console.error('saveField', col, error);
    setStatus('Speichern fehlgeschlagen', 'err');
    return false;
  }
  setStatus('Gespeichert', '');
  return true;
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ============================================================
   DATA LOADING
   ============================================================ */
function isAuthError(error) {
  if (!error) return false;
  const msg = (error.message || '').toLowerCase();
  const code = error.code || '';
  return error.status === 401 || error.status === 403
      || code === 'PGRST301' || code === '42501'
      || msg.includes('jwt') || msg.includes('token') || msg.includes('unauthorized');
}

async function loadData() {
  setStatus('Lade...', 'warn');
  const { data, error } = await sb.from('todo_data').select('master_data,manual_entries,done_state,prio_state,deleted_state,zuletzt_aktualisiert').eq('id', 1).single();
  if (error || !data) {
    console.error('loadData', error);
    if (isAuthError(error)) {
      setStatus('Sitzung abgelaufen', 'err');
      await sb.auth.signOut();
      return;
    }
    masterData.todos = [];
    masterData.themen = [];
    setStatus('Laden fehlgeschlagen', 'err');
    renderCurrentView();
    updateNavBadges();
    return;
  }
  const master = data.master_data || {};
  // Defensive Sanitization: nur echte Objekte durchlassen (null/undefined/primitives raus)
  const isObj = t => t && typeof t === 'object' && !Array.isArray(t);
  const sane = a => (Array.isArray(a) ? a.filter(isObj) : []);
  masterData.todos = [...sane(master.todos), ...sane(master.offene_punkte)];
  masterData.themen = sane(master.themen);
  LS.manual = sane(data.manual_entries);
  LS.done = (data.done_state && typeof data.done_state === 'object') ? data.done_state : {};
  LS.prio = (data.prio_state && typeof data.prio_state === 'object') ? data.prio_state : {};
  LS.deleted = (data.deleted_state && typeof data.deleted_state === 'object') ? data.deleted_state : {};
  setStatus('Geladen', '');
  console.log('[loadData] master keys:', Object.keys(master), 'todos:', masterData.todos.length, 'themen:', masterData.themen.length, 'manual:', LS.manual.length, 'done:', Object.keys(LS.done).length, 'deleted:', Object.keys(LS.deleted).length);
  if (masterData.todos.length > 0) console.log('[loadData] first todo:', masterData.todos[0]);
  const stand = data.zuletzt_aktualisiert || master.zuletzt_aktualisiert || '';
  document.getElementById('lastUpdate').textContent = stand ? 'Stand: ' + stand : '';
  renderCurrentView();
  updateNavBadges();
}

/* ============================================================
   REALTIME SYNC — todo_data Row 1
   Hört auf Änderungen (INSERT/UPDATE/DELETE) und lädt neu.
   ============================================================ */
let realtimeChannel = null;

function startRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb
    .channel('todo_data_row_1')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'todo_data', filter: 'id=eq.1' },
      async () => {
        await loadData();
        setStatus('Synchronisiert', '');
      })
    .subscribe((status) => {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        console.warn('Realtime channel:', status);
      }
    });
}

async function stopRealtime() {
  if (!realtimeChannel) return;
  await sb.removeChannel(realtimeChannel);
  realtimeChannel = null;
}

/* ============================================================
   ID HELPERS
   ============================================================ */
function tid(t) {
  if (!t || typeof t !== 'object') return 'todo_invalid';
  if (t.id) return 'todo_' + t.id;
  const s = t.text || '';
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return 'todo_' + Math.abs(h).toString(36) + '_' + s.slice(0, 20).replace(/\W/g, '_');
}
function thid(t) {
  if (!t || typeof t !== 'object') return 'thema_invalid';
  if (t.id) return 'thema_' + t.id;
  const s = t.titel || '';
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return 'thema_' + Math.abs(h).toString(36) + '_' + s.slice(0, 20).replace(/\W/g, '_');
}
function getPrio(key) {
  const p = LS.prio[key];
  return (p === 0 || p === 1 || p === 2 || p === 3) ? p : 3;
}
function parseDate(q) {
  if (!q) return 0;
  const m = q.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  return m ? new Date(m[3], m[2] - 1, m[1]).getTime() : 0;
}

/* ============================================================
   RENDER TODOS
   ============================================================ */
const PRIO_LABELS = { 0: 'Kritisch', 1: 'Hoch', 2: 'Mittel', 3: 'Niedrig' };

function renderTodos() {
  const manualTodos = LS.manual.filter(t => t._type === 'todo');
  const raw = [...masterData.todos, ...manualTodos];
  const manualSet = new Set(manualTodos.map(t => t.id || t.text || ''));
  const seenKeys = {};
  // Filter out deleted items
  const all = raw.map(t => {
    let key = tid(t);
    if (seenKeys[key] !== undefined) { seenKeys[key]++; key = key + '_' + seenKeys[key]; }
    else seenKeys[key] = 0;
    return { ...t, _key: key, _isManual: manualSet.has(t.id || t.text || '') };
  }).filter(t => !LS.deleted[t._key]);

  const open = all.filter(t => !LS.done[t._key]);
  const done = all.filter(t => LS.done[t._key]);

  // Update stats
  animateCount('sOpen', open.length);
  animateCount('sDone', done.length);
  document.getElementById('cAll').textContent = all.length;
  document.getElementById('cOpen').textContent = open.length;
  document.getElementById('cDone').textContent = done.length;

  const pct = all.length > 0 ? Math.round((done.length / all.length) * 100) : 0;
  document.getElementById('heroPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  // Search
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

  // Filter base
  let baseItems = statusFilter === 'open' ? open : statusFilter === 'done' ? done : all;
  if (q) baseItems = baseItems.filter(t => (t.text || '').toLowerCase().includes(q));

  if (!baseItems.length) {
    document.getElementById('todoList').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div class="empty-state-title">${q ? 'Nichts gefunden' : statusFilter === 'open' ? 'Alles erledigt' : 'Hier ist es leer'}</div>
        <div class="empty-state-sub">${q ? 'Versuche einen anderen Suchbegriff.' : 'Kein Eintrag in dieser Ansicht.'}</div>
      </div>`;
    return;
  }

  // Group by priority
  const groups = { 0: [], 1: [], 2: [], 3: [] };
  baseItems.forEach(t => { groups[getPrio(t._key)].push(t); });

  // Sort within each group by date desc
  const now = Date.now();
  Object.keys(groups).forEach(p => {
    groups[p].sort((a, b) => {
      const da = parseDate(a.quelle || '') || a._createdAt || now;
      const db = parseDate(b.quelle || '') || b._createdAt || now;
      return db - da;
    });
  });

  let html = '';
  for (const p of [0, 1, 2, 3]) {
    const items = groups[p];
    if (!items.length) continue;
    html += `
      <div class="priority-group">
        <div class="pg-header">
          <div class="pg-dot" data-p="${p}"></div>
          <div class="pg-title">${PRIO_LABELS[p]}</div>
          <div class="pg-count">${items.length}</div>
        </div>
        <div class="pg-list">
          ${items.map(t => renderTodoRow(t)).join('')}
        </div>
      </div>`;
  }
  document.getElementById('todoList').innerHTML = html;
}

function renderTodoRow(t) {
  const key = t._key;
  const isDone = !!LS.done[key];
  const p = getPrio(key);
  const ctx = t.kontext || t.details || '';
  return `<div class="todo-row ${isDone ? 'done' : ''}" id="row_${esc(key)}">
    <div class="todo-compact" onclick="toggleExpand('${esc(key)}',event)">
      <button class="chk ${isDone ? 'on' : ''}" onclick="event.stopPropagation();toggleDone('${esc(key)}',this)" aria-label="Erledigt umschalten">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <div class="todo-body"><div class="todo-title">${esc(t.text || '')}</div></div>
      <div class="todo-right">
        <span class="prio-pill">P${p}</span>
        ${ctx ? '<span class="expand-arrow">▾</span>' : ''}
      </div>
    </div>
    ${ctx ? `<div class="todo-expanded">
      <div class="todo-kontext">${esc(ctx)}</div>
      <div class="todo-expanded-actions">
        <select class="prio-select" onchange="setPrio('${esc(key)}',parseInt(this.value))">
          <option value="0" ${p === 0 ? 'selected' : ''}>P0 — Kritisch</option>
          <option value="1" ${p === 1 ? 'selected' : ''}>P1 — Hoch</option>
          <option value="2" ${p === 2 ? 'selected' : ''}>P2 — Mittel</option>
          <option value="3" ${p === 3 ? 'selected' : ''}>P3 — Niedrig</option>
        </select>
        <button class="del-btn" onclick="deleteTodo('${esc(key)}',${t._isManual})">Löschen</button>
      </div>
    </div>` : `<div class="todo-expanded" style="padding-left:52px"><div class="todo-expanded-actions" style="margin-top:0;padding-top:14px">
      <select class="prio-select" onchange="setPrio('${esc(key)}',parseInt(this.value))">
        <option value="0" ${p === 0 ? 'selected' : ''}>P0 — Kritisch</option>
        <option value="1" ${p === 1 ? 'selected' : ''}>P1 — Hoch</option>
        <option value="2" ${p === 2 ? 'selected' : ''}>P2 — Mittel</option>
        <option value="3" ${p === 3 ? 'selected' : ''}>P3 — Niedrig</option>
      </select>
      <button class="del-btn" onclick="deleteTodo('${esc(key)}',${t._isManual})">Löschen</button>
    </div></div>`}
  </div>`;
}

function toggleExpand(key, e) {
  if (e.target.closest('.chk')) return;
  const row = document.getElementById('row_' + key);
  if (!row) return;
  const was = row.classList.contains('expanded');
  document.querySelectorAll('.todo-row.expanded,.thema-card.expanded').forEach(r => r.classList.remove('expanded'));
  if (!was) row.classList.add('expanded');
}

/* ============================================================
   RENDER THEMEN
   ============================================================ */
function renderThemen() {
  const manualThemen = LS.manual.filter(t => t._type === 'thema');
  const all = [...masterData.themen, ...manualThemen]
    .sort((a, b) => parseDate(b.quelle || '') - parseDate(a.quelle || ''));
  const manualKeys = new Set(manualThemen.map(t => thid(t)));

    return;
  }
  document.getElementById('themenList').innerHTML = all.map(t => {
    const key = thid(t);
    return `<div class="thema-card" id="row_${esc(key)}" onclick="toggleThema('${esc(key)}')">
      <div class="thema-compact">
        <div class="thema-title">${esc(t.titel || '')}</div>

  }).join('');
}

async function addManual() {

  if (!text) return;
  const typ = document.getElementById('mTyp').value;

  const item = { id, _type: typ, _manual: true, _createdAt: Date.now(), kontext: document.getElementById('mKontext').value.trim() };
  if (typ === 'thema') { item.titel = text; item.details = item.kontext; delete item.kontext; }
  else item.text = text;

  LS.prio[key] = parseInt(document.getElementById('mPrio').value);

  else setView('themen');

function deleteTodo(key, isManual) {
  if (!confirm('Diese Aufgabe wirklich löschen?')) return;
  if (isManual) {
    const bare = key.replace(/^(todo_|thema_)/, '');
    LS.manual = LS.manual.filter(t => t.id !== bare);
    saveField('manual');
  } else {
    LS.deleted[key] = true;
    saveField('deleted');
  }
  if (LS.done[key]) { delete LS.done[key]; saveField('done'); }
  if (LS.prio[key] !== undefined) { delete LS.prio[key]; saveField('prio'); }
  renderCurrentView();
  updateNavBadges();
}

function clearAllDone() {
  const count = Object.keys(LS.done).length;
  if (count === 0) return;
  if (!confirm(`${count} erledigte Aufgaben endgültig löschen?`)) return;
  Object.keys(LS.done).forEach(key => { LS.deleted[key] = true; });
  LS.manual = LS.manual.filter(t => {
    const key = t._type === 'todo' ? tid(t) : thid(t);
    return !LS.done[key];
  });
  LS.done = {};
  saveField('deleted');
  saveField('manual');
  saveField('done');
  renderCurrentView();
  updateNavBadges();
}

function deleteManual(key) {
  const bare = key.replace(/^(todo_|thema_)/, '');
  LS.manual = LS.manual.filter(t => t.id !== bare);
  saveField('manual');
  if (LS.done[key]) { delete LS.done[key]; saveField('done'); }
  if (LS.prio[key] !== undefined) { delete LS.prio[key]; saveField('prio'); }
  renderCurrentView();
  updateNavBadges();
}

/* ============================================================
   COUNT-UP ANIMATION
   ============================================================ */
const _counters = {};
function animateCount(id, target) {
  const el = document.getElementById(id);
  if (!el) return;
  const cur = (_counters[id] !== undefined ? _counters[id] : (parseInt(el.textContent) || 0));
  if (cur === target) { el.textContent = target; _counters[id] = target; return; }
  const dur = 500, t0 = performance.now();
  const tick = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const v = Math.round(cur + (target - cur) * eased);
    el.textContent = v;
    if (p < 1) requestAnimationFrame(tick);
    else _counters[id] = target;
  };
  requestAnimationFrame(tick);
}

/* ============================================================
   ESCAPE
   ============================================================ */
function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function doLogin() {
  const email = document.getElementById('loginUser').value.trim();
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginError');
  const infoEl = document.getElementById('loginInfo');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  infoEl.textContent = '';
  if (!email || !pw) { errEl.textContent = 'Bitte alle Felder ausfüllen.'; return; }
  btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  btn.disabled = false;
  if (error) {
    errEl.textContent = 'E-Mail oder Passwort falsch.';
    document.getElementById('loginPw').value = '';
  }
  // Erfolgsfall: onAuthStateChange übernimmt
}

async function doPasswordReset() {
  const email = document.getElementById('loginUser').value.trim();
  const errEl = document.getElementById('loginError');
  const infoEl = document.getElementById('loginInfo');
  errEl.textContent = '';
  infoEl.textContent = '';
  if (!email) { errEl.textContent = 'Bitte E-Mail-Adresse eingeben.'; return; }
  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
  if (error) errEl.textContent = error.message;
  else infoEl.textContent = 'E-Mail mit Reset-Link verschickt.';
}

async function doLogout() {
  try {
    await sb.auth.signOut();
  } catch (e) {
    console.warn('signOut failed, cleaning up locally', e);
  }
  // Defensive: lokal aufräumen, falls onAuthStateChange wegen Token-Fehler nicht feuert
  await stopRealtime();
  currentUser = null;
  needsPasswordSetup = false;
  hideSetup();
  masterData = { todos: [], themen: [] };
  LS.done = {}; LS.prio = {}; LS.manual = []; LS.deleted = {};
  // Supabase-Session aus localStorage entfernen (falls signOut Token-Probleme hatte)
  try {
    Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k));
  } catch (_) {}
  renderCurrentView();
  updateNavBadges();
  showLogin();
}

async function doPasswordSetup() {

  const pw2 = document.getElementById('setupPw2').value;
  const errEl = document.getElementById('setupError');
  const btn = document.getElementById('setupBtn');

  btn.disabled = false;
  if (error) {
    errEl.textContent = error.message || 'Passwort konnte nicht gespeichert werden.';

  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  needsPasswordSetup = false;
  hideSetup();
  await loadData();
  startRealtime();
}

// Korrupte/abgelaufene Session aus localStorage räumen und zum Login.
function purgeAuthAndShowLogin() {
  try {
    Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k));
  } catch (_) {}
  currentUser = null;
  showLogin();
}

// Promise mit hartem Timeout — schützt gegen hängende Supabase-Calls
// bei korruptem Refresh-Token im localStorage.
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timeout')), ms))
  ]);
}

// Schneller Pre-Check: abgelaufenen Token direkt aus localStorage erkennen,
// statt 4s auf getSession() zu warten (Refresh hängt bei korruptem Token).
function preCheckExpiredSession() {
  try {
    const sbKeys = Object.keys(localStorage).filter(k => k.startsWith('sb-'));
    console.log('[boot] sb-* keys in localStorage:', sbKeys);
    const key = sbKeys.find(k => k.endsWith('-auth-token'));
    if (!key) { console.log('[boot] no auth-token key'); return false; }
    const raw = localStorage.getItem(key);
    if (!raw) { console.log('[boot] auth-token empty'); return false; }
    const parsed = JSON.parse(raw);
    const expiresAt = parsed?.expires_at;
    const refreshToken = parsed?.refresh_token || '';
    const nowSec = Math.floor(Date.now() / 1000);
    console.log('[boot] expires_at:', expiresAt, 'now:', nowSec, 'expired:', expiresAt < nowSec, 'refreshToken length:', refreshToken.length);
    // Abgelaufen ODER Refresh-Token sieht ungültig aus → purgen
    if (expiresAt && (expiresAt < nowSec || refreshToken.length < 20)) {
      console.warn('[boot] expired or invalid session, purging');
      return true;
    }
  } catch (e) { console.warn('[boot] preCheck error:', e); }
  return false;
}

(async () => {
  if (preCheckExpiredSession()) {
    purgeAuthAndShowLogin();
    return;
  }
  let session = null;
  try {
    const result = await withTimeout(sb.auth.getSession(), 1500, 'getSession');
    session = result?.data?.session || null;
  } catch (e) {
    console.warn('Boot: getSession failed, purging session', e);
    purgeAuthAndShowLogin();
    return;
  }
  if (session) {
    // Token serverseitig validieren — getSession() liest nur localStorage
    // und kann eine abgelaufene/ungültige Session zurückgeben.
    let user = null;
    try {
      const result = await withTimeout(sb.auth.getUser(), 4000, 'getUser');
      if (result?.error || !result?.data?.user) {
        console.warn('Boot: invalid session', result?.error);
        purgeAuthAndShowLogin();
        return;
      }
      user = result.data.user;
    } catch (e) {
      console.warn('Boot: getUser failed', e);
      purgeAuthAndShowLogin();
      return;
    }
    currentUser = user;
    hideLogin();
    if (needsPasswordSetup) {
      showSetup();
    } else {
      await loadData();
      startRealtime();
    }
  } else {
    showLogin();
    if (initialHashError) {
      const errEl = document.getElementById('loginError');
      if (initialHashError.code === 'otp_expired') {
        errEl.textContent = 'Dieser Einladungs- oder Reset-Link ist abgelaufen oder wurde bereits verwendet. Bitte einen neuen Link anfordern.';
      } else {
        errEl.textContent = initialHashError.desc || 'Login-Link konnte nicht verarbeitet werden.';
      }
      // Hash entfernen, damit ein Reload die Fehlermeldung nicht erneut zeigt
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }
  }
})();

sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    needsPasswordSetup = true;
    if (session) currentUser = session.user;
    hideLogin();
    showSetup();
    return;
  }
  if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
    if (!session) return;
    const wasLoggedIn = currentUser !== null;
    currentUser = session.user;
    hideLogin();
    if (needsPasswordSetup) {
      showSetup();
    } else if (!wasLoggedIn || !realtimeChannel) {
      await loadData();
      startRealtime();
    }
  } else if (event === 'SIGNED_OUT') {
    await stopRealtime();
    currentUser = null;
    needsPasswordSetup = false;
    hideSetup();
    masterData = { todos: [], themen: [] };
    LS.done = {}; LS.prio = {}; LS.manual = []; LS.deleted = {};
    renderCurrentView();
    updateNavBadges();
    showLogin();
  }
});
</script>
